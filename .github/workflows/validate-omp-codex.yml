name: Validate OMP Codex subscription

on:
  push:
    branches: [validation/omp-codex-422]

permissions:
  contents: read

concurrency:
  group: omp-codex-validation
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked frontend dependencies
        run: |
          npm install --global pnpm@9.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript and translations
        run: |
          pnpm exec tsc --noEmit
          pnpm i18n:check
      - name: Full frontend suite
        run: pnpm test
      - name: Production frontend build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Codex subscription browser regression and screenshots
        if: ${{ !cancelled() }}
        run: node scripts/omp-codex-validation/run.mjs --output "$RUNNER_TEMP/omp-ui"
      - name: Upload fixture screenshots and checks only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-codex-ui
          path: |
            ${{ runner.temp }}/omp-ui/omp-subscription-ui-*/*.png
            ${{ runner.temp }}/omp-ui/omp-subscription-ui-*/results.json
          if-no-files-found: warn
          retention-days: 7
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official stable Rust and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Check Rust formatting
        run: cargo fmt --manifest-path tauri/Cargo.toml --all -- --check
      - name: Full Rust suite
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path tauri/Cargo.toml --locked --jobs 2
