name: Validate OMP Codex subscription

on:
  push:
    branches: [validation/omp-codex-422]

permissions:
  contents: read

concurrency:
  group: omp-codex-validation-ui
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked frontend dependencies
        run: |
          npm install --global pnpm@9.15.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install official Chinese fonts for screenshot verification
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: TypeScript and translations
        run: |
          pnpm exec tsc --noEmit
          pnpm i18n:check
      - name: Diagnose installed browser startup
        continue-on-error: true
        run: |
          ls -l /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome || true
          google-chrome --version
          timeout 30s google-chrome --headless=new --disable-background-networking --no-first-run --user-data-dir="$RUNNER_TEMP/chrome-probe" --dump-dom about:blank
      - name: Verify Google Chrome CDP with sandbox enabled
        continue-on-error: true
        run: |
          profile="$RUNNER_TEMP/chrome-cdp-probe"
          /usr/bin/google-chrome --headless=new --remote-debugging-port=0 --user-data-dir="$profile" --no-first-run --no-default-browser-check --disable-extensions --disable-background-networking about:blank > "$RUNNER_TEMP/chrome-cdp-probe.log" 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 150); do
            if [ -f "$profile/DevToolsActivePort" ]; then
              port=$(head -n 1 "$profile/DevToolsActivePort")
              if curl --silent --show-error --fail "http://127.0.0.1:$port/json/list"; then
                exit 0
              fi
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/chrome-cdp-probe.log"
          exit 1
      - name: Full frontend suite
        run: |
          # Same suite and order as pnpm test; pin its browser fixtures to the probed browser.
          pnpm run test:web
          pnpm run test:form-modal-layout
          pnpm run test:provider-card-layout
          pnpm run test:provider-list-drag --browser /usr/bin/google-chrome
          pnpm run test:provider-list-locate --browser /usr/bin/google-chrome
          pnpm run test:official-account-card --browser /usr/bin/google-chrome
          pnpm run test:codex-official-accounts --browser /usr/bin/google-chrome
          pnpm run test:provider-card-spacing --browser /usr/bin/google-chrome
          pnpm run test:official-accounts-shared
      - name: Production frontend build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Codex subscription browser regression and screenshots
        if: ${{ !cancelled() }}
        run: node scripts/omp-codex-validation/run.mjs --browser /usr/bin/google-chrome --output "$RUNNER_TEMP/omp-ui"
      - name: Upload fixture screenshots and checks only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-codex-ui
          path: |
            ${{ runner.temp }}/omp-ui/omp-subscription-ui-*/*.png
            ${{ runner.temp }}/omp-ui/omp-subscription-ui-*/results.json
          if-no-files-found: warn
          retention-days: 7
  rust:
    if: ${{ false }} # Same product tree verified in run 38042008994; this retry changes only fixtures.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install official stable Rust and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Record whole-repository formatting result
        continue-on-error: true
        run: cargo fmt --manifest-path tauri/Cargo.toml --all -- --check
      - name: Check changed Rust files
        run: rustfmt --edition 2021 --check tauri/src/coding/oh_my_pi/commands.rs tauri/src/coding/oh_my_pi/types.rs tauri/src/coding/oh_my_pi/subscription.rs
      - name: Full Rust suite
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path tauri/Cargo.toml --locked --no-fail-fast --jobs 2
      - name: OMP regression suite
        if: ${{ !cancelled() }}
        run: |
          cargo test --manifest-path tauri/Cargo.toml --locked --jobs 2 --lib coding::oh_my_pi::
      - name: Prepare unchanged upstream baseline
        if: ${{ !cancelled() }}
        run: git worktree add --detach "$RUNNER_TEMP/omp-baseline" 9a1d3c35747e6abce90b6506e31102f13c039c55
      - name: Compare whole-repository baseline formatting
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo fmt --manifest-path "$RUNNER_TEMP/omp-baseline/tauri/Cargo.toml" --all -- --check
      - name: Compare unrelated npm path tests on upstream baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tauri/target
        run: cargo test --manifest-path "$RUNNER_TEMP/omp-baseline/tauri/Cargo.toml" --locked --jobs 2 --lib coding::cli_extensions::tests::npm_
